[source: 1]<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATALHA NAVAL DO MARCELO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #030712;
  --panel-bg: rgba(10, 18, 38, 0.85);
  --cyan-glow: #00f0ff;
  --blue-neon: #1d77ff;
  --red-neon: #ff0055;
  --grid-line: rgba(0, 240, 255, 0.2);
  --cell-water: rgba(9, 29, 59, 0.55);
  --text-primary: #e2f1ff;
  --text-dim: #6482a6;
}

* {
  box-sizing: border-box;
  user-select: none;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at 50% 20%, #0c1c38 0%, #050b18 50%, var(--bg-deep) 100%);
  color: var(--text-primary);
  font-family: 'Rajdhani', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: 
    linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
    linear-gradient(180deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.wrap {
  width: min(1100px, 100%);
  max-height: 98vh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}

header {
  text-align: center;
  margin-bottom: 12px;
}

h1 {
  margin: 0;
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(20px, 3vw, 32px);
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff 0%, var(--cyan-glow) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
}

.sub {
  color: var(--text-dim);
  font-size: 13px;
  letter-spacing: 1px;
  margin-top: 2px;
  text-transform: uppercase;
  font-weight: 600;
}

.panel {
  background: var(--panel-bg);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(0, 240, 255, 0.25);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.05);
}

.top {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.audio-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(4, 12, 26, 0.8);
  border: 1px solid rgba(0, 240, 255, 0.3);
  padding: 4px 10px;
  border-radius: 6px;
}

.audio-controls label {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  color: var(--cyan-glow);
}

.audio-controls input[type=range] {
  accent-color: var(--cyan-glow);
  cursor: pointer;
  width: 70px;
}

button {
  font-family: 'Orbitron', sans-serif;
  border: 1px solid var(--blue-neon);
  background: rgba(18, 39, 68, 0.6);
  color: var(--text-primary);
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

button:hover {
  background: var(--blue-neon);
  color: #fff;
  box-shadow: 0 0 12px rgba(29, 119, 255, 0.6);
  transform: translateY(-1px);
}

button.active {
  background: var(--cyan-glow);
  color: #030712;
  border-color: var(--cyan-glow);
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
}

button.music-btn {
  border-color: var(--cyan-glow);
  background: rgba(0, 240, 255, 0.1);
}

.status-bar {
  background: rgba(4, 12, 26, 0.85);
  border: 1px solid rgba(0, 240, 255, 0.2);
  border-radius: 8px;
  padding: 8px 14px;
  text-align: center;
  min-height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cyan-glow);
  font-family: 'Orbitron', sans-serif;
  font-size: 12px;
  margin-bottom: 14px;
}

.boards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.boardbox {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.boardbox h2 {
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  margin: 0 0 10px 0;
  letter-spacing: 1.5px;
}

.boardbox.player h2 { color: var(--cyan-glow); }
.boardbox.enemy h2 { color: var(--red-neon); }

.grid-container {
  display: grid;
  grid-template-columns: 20px 1fr;
  grid-template-rows: 20px 1fr;
  gap: 2px;
  width: min(360px, 100%);
}

.labels-top {
  grid-column: 2;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  text-align: center;
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  color: var(--text-dim);
  line-height: 20px;
}

.labels-left {
  grid-row: 2;
  display: grid;
  grid-template-rows: repeat(10, 1fr);
  text-align: center;
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  color: var(--text-dim);
}

.labels-left span {
  display: flex;
  align-items: center;
  justify-content: center;
}

.board-wrapper {
  grid-column: 2;
  grid-row: 2;
  position: relative;
  width: 100%;
  aspect-ratio: 1;
}

.grid {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 2px;
  background: rgba(3, 10, 22, 0.9);
  padding: 4px;
  border-radius: 6px;
  border: 1px solid var(--grid-line);
  position: relative;
  overflow: hidden;
}

.grid::after {
  content: "";
  position: absolute;
  inset: -50%;
  background: conic-gradient(from 0deg, transparent 0deg 300deg, rgba(0, 240, 255, 0.08) 360deg);
  animation: radar 8s linear infinite;
  pointer-events: none;
}

@keyframes radar {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.ships-overlay {
  position: absolute;
  inset: 4px;
  pointer-events: none;
  z-index: 1;
}

.cell {
  position: relative;
  background: var(--cell-water);
  border: 1px solid rgba(0, 240, 255, 0.08);
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s ease;
  z-index: 2;
}

.enemy .cell:hover {
  background: rgba(0, 240, 255, 0.25);
  border-color: var(--cyan-glow);
  box-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
  transform: scale(1.05);
  z-index: 3;
}

.cell.hit {
  background: rgba(255, 0, 85, 0.25);
  border-color: var(--red-neon);
}

.cell.hit::after {
  content: "💥";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: clamp(8px, 1.5vw, 14px);
}

.cell.miss::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 4px;
  height: 4px;
  background: var(--cyan-glow);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 6px var(--cyan-glow);
}

.rendered-ship {
  position: absolute;
  transition: all 0.3s ease;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
}

.stats {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-top: 14px;
  font-family: 'Orbitron', sans-serif;
  font-size: 13px;
}

.stats b {
  background: rgba(0, 0, 0, 0.4);
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #fff;
}

@media(max-width: 820px){
  .boards { grid-template-columns: 1fr; gap: 16px; }
  .panel { padding: 12px; }
  body { padding: 5px; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>⚓ BATALHA NAVAL DO MARCELO </h1>
    <div class="sub">Tática de Combate Naval • AI vs Player</div>
  </header>

  <div class="panel">
    <div class="top">
      <button id="newBtn">🎮 Novo Jogo</button>
      <button id="easyBtn">IA Fácil</button>
      <button id="hardBtn" class="active">IA Tática</button>
      
      <div class="audio-controls">
        <button id="musicToggleBtn" class="music-btn">🎵 Techno: OFF</button>
        <label for="volumeSlider">VOL</label>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5">
      </div>
    </div>

    <div id="status" class="status-bar">Inicializando radares... Clique em uma coordenada inimiga.</div>

    <div class="boards">
      <section class="boardbox player">
        <h2>🟦 FROTA DO DJ MARCELO</h2>
        <div class="grid-container">
          <div></div>
          <div class="labels-top" id="p-labels-top"></div>
          <div class="labels-left" id="p-labels-left"></div>
          <div class="board-wrapper">
            <div id="p-overlay" class="ships-overlay"></div>
            <div id="player" class="grid"></div>
          </div>
        </div>
      </section>

      <section class="boardbox enemy">
        <h2>🟥 FROTA INIMIGA (IA)</h2>
        <div class="grid-container">
          <div></div>
          <div class="labels-top" id="e-labels-top"></div>
          <div class="labels-left" id="e-labels-left"></div>
          <div class="board-wrapper">
            <div id="e-overlay" class="ships-overlay"></div>
            <div id="enemy" class="grid"></div>
          </div>
        </div>
      </section>
    </div>

    <div class="stats">
      <span>SEUS NAVIOS: <b id="pShips" style="color: var(--cyan-glow);">5</b></span>
      <span>NAVIOS IA: <b id="eShips" style="color: var(--red-neon);">5</b></span>
    </div>
  </div>
</div>

<script>
class TechnoSynthesizer {
  constructor() {
    this.ctx = null;
    this.isPlaying = false;
    this.bpm = 132;
    this.step = 0;
    this.timer = null;
    this.masterGain = null;
    this.volume = 0.5;

    this.bassline = [
      65.41, 65.41, 0, 65.41,
      77.78, 65.41, 0, 65.41,
      58.27, 65.41, 0, 65.41,
      87.31, 77.78, 65.41, 58.27
    ];
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = this.volume;
      this.masterGain.connect(this.ctx.destination);
    }
  }

  setVolume(v) {
    this.volume = v;
    if (this.masterGain && this.ctx) {
      this.masterGain.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05);
    }
  }

  start() {
    this.init();
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    if (this.isPlaying) return;
    this.isPlaying = true;
    this.step = 0;

    const stepDuration = (60 / this.bpm) / 4;
    this.timer = setInterval(() => {
      this.playStep();
      this.step = (this.step + 1) % 16;
    }, stepDuration * 1000);
  }

  stop() {
    if (!this.isPlaying) return;
    this.isPlaying = false;
    clearInterval(this.timer);
  }

  toggle() {
    if (this.isPlaying) {
      this.stop();
    } else {
      this.start();
    }
    return this.isPlaying;
  }

  playStep() {
    const time = this.ctx.currentTime;

    if (this.step % 4 === 0) {
      this.playKick(time);
    }

    if (this.step % 4 === 2) {
      this.playHiHat(time);
    }

    const noteFreq = this.bassline[this.step];
    if (noteFreq > 0) {
      this.playBassNote(time, noteFreq);
    }
  }

  playKick(time) {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(140, time);
    osc.frequency.exponentialRampToValueAtTime(38, time + 0.12);

    gain.gain.setValueAtTime(1.0, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.28);

    osc.connect(gain);
    gain.connect(this.masterGain);

    osc.start(time);
    osc.stop(time + 0.28);
  }

  playHiHat(time) {
    const bufferSize = this.ctx.sampleRate * 0.08;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }

    const whiteNoise = this.ctx.createBufferSource();
    whiteNoise.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 7000;

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.3, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);

    whiteNoise.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);

    whiteNoise.start(time);
    whiteNoise.stop(time + 0.08);
  }

  playBassNote(time, freq) {
    const osc = this.ctx.createOscillator();
    const filter = this.ctx.createBiquadFilter();
    const gain = this.ctx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, time);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(300, time);
    filter.frequency.exponentialRampToValueAtTime(1800, time + 0.05);
    filter.frequency.exponentialRampToValueAtTime(300, time + 0.15);
    filter.Q.value = 5;

    gain.gain.setValueAtTime(0.4, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.16);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);

    osc.start(time);
    osc.stop(time + 0.16);
  }
}

const technoSynth = new TechnoSynthesizer();

const N = 10;
const cols = ["A","B","C","D","E","F","G","H","I","J"];

const shipTypes = [
  { id: 'carrier', len: 5, name: 'Porta-Aviões' },
  { id: 'battleship', len: 4, name: 'Encouraçado' },
  { id: 'cruiser', len: 3, name: 'Cruzador' },
  { id: 'submarine', len: 3, name: 'Submarino' },
  { id: 'destroyer', len: 2, name: 'Patrulha' }
];

let P, E, pShipsData = [], eShipsData = [], turn = true, over = false, mode = "hard", targetQueue = [];

const playerEl = document.getElementById("player"), enemyEl = document.getElementById("enemy");
const pOverlay = document.getElementById("p-overlay"), eOverlay = document.getElementById("e-overlay");
const statusEl = document.getElementById("status");

function setupLabels() {
  const setup = (topId, leftId) => {
    const top = document.getElementById(topId);
    const left = document.getElementById(leftId);
    top.innerHTML = ""; left.innerHTML = "";
    cols.forEach(c => top.innerHTML += `<span>${c}</span>`);
    for(let i=1; i<=10; i++) left.innerHTML += `<span>${i}</span>`;
  };
  setup("p-labels-top", "p-labels-left");
  setup("e-labels-top", "e-labels-left");
}

function getShipSVG(type) {
  const SVGs = {
    carrier: `<svg viewBox="0 0 500 100" width="100%" height="100%"><path d="M10,20 L430,10 L490,50 L430,90 L10,80 Z" fill="#4a5568" stroke="#cbd5e1" stroke-width="4"/><rect x="40" y="25" width="360" height="50" fill="#334155" stroke="#94a3b8" stroke-width="2"/><line x1="50" y1="50" x2="380" y2="50" stroke="#f1f5f9" stroke-width="3" stroke-dasharray="12,12"/><polygon points="120,30 135,45 110,45" fill="#00f0ff"/><polygon points="220,30 235,45 210,45" fill="#00f0ff"/><polygon points="160,58 175,73 150,73" fill="#00f0ff"/><circle cx="440" cy="50" r="12" fill="#64748b"/></svg>`,
    battleship: `<svg viewBox="0 0 400 100" width="100%" height="100%"><path d="M5,50 Q40,20 100,20 L320,25 Q380,35 395,50 Q380,65 320,75 L100,80 Q40,80 5,50 Z" fill="#52606d" stroke="#cbd5e1" stroke-width="4"/><circle cx="90" cy="50" r="14" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/><circle cx="160" cy="50" r="16" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/><rect x="210" y="35" width="60" height="30" rx="5" fill="#334155" stroke="#cbd5e1"/><circle cx="310" cy="50" r="14" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/></svg>`,
    cruiser: `<svg viewBox="0 0 300 100" width="100%" height="100%"><path d="M10,50 Q50,25 120,25 L240,30 Q290,40 295,50 Q290,60 240,70 L120,75 Q50,75 10,50 Z" fill="#475569" stroke="#94a3b8" stroke-width="4"/><circle cx="80" cy="50" r="12" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/><rect x="130" y="38" width="45" height="24" fill="#1e293b"/><circle cx="210" cy="50" r="12" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/></svg>`,
    submarine: `<svg viewBox="0 0 300 100" width="100%" height="100%"><path d="M20,50 Q50,30 150,30 Q250,30 285,50 Q250,70 150,70 Q50,70 20,50 Z" fill="#334155" stroke="#64748b" stroke-width="4"/><rect x="120" y="38" width="50" height="24" rx="12" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/><circle cx="60" cy="50" r="6" fill="#00f0ff"/><circle cx="240" cy="50" r="6" fill="#00f0ff"/></svg>`,
    destroyer: `<svg viewBox="0 0 200 100" width="100%" height="100%"><path d="M10,50 Q40,30 100,30 L160,35 Q195,45 198,50 Q195,55 160,65 L100,70 Q40,70 10,50 Z" fill="#64748b" stroke="#cbd5e1" stroke-width="3"/><circle cx="60" cy="50" r="10" fill="#1e293b"/><rect x="100" y="40" width="30" height="20" fill="#334155"/></svg>`
  };
  return SVGs[type] || '';
}

function empty(){ return Array.from({length:N}, ()=>Array(N).fill(0)); }

function canPlace(b, r, c, len, hor) {
  for(let k=0; k<len; k++) {
    let y = r + (hor ? 0 : k), x = c + (hor ? k : 0);
    if(y >= N || x >= N || b[y][x]) return false;
  }
  for(let y = Math.max(0, r-1); y <= Math.min(N-1, r+(hor?1:len)); y++)
    for(let x = Math.max(0, c-1); x <= Math.min(N-1, c+(hor?len:1)); x++)
      if(b[y][x]) return false;
  return true;
}

function placeFleet(b) {
  let shipsData = [];
  for(const ship of shipTypes) {
    let ok = false;
    while(!ok) {
      let hor = Math.random() < 0.5, r = Math.floor(Math.random()*N), c = Math.floor(Math.random()*N);
      if(canPlace(b, r, c, ship.len, hor)) {
        for(let k=0; k<ship.len; k++) {
          let y = r + (hor ? 0 : k), x = c + (hor ? k : 0);
          b[y][x] = 1;
        }
        shipsData.push({ ...ship, r, c, hor, sunk: false });
        ok = true;
      }
    }
  }
  return shipsData;
}

function reset() {
  P = empty(); E = empty();
  pShipsData = placeFleet(P);
  eShipsData = placeFleet(E);
  turn = true; over = false; targetQueue = [];
  render();
  statusEl.textContent = "Sua vez! Selecione um alvo nas coordenadas inimigas.";
}

function render() {
  drawGrid(playerEl, P, true);
  drawGrid(enemyEl, E, false);
  renderOverlay(pOverlay, pShipsData, true);
  renderOverlay(eOverlay, eShipsData, false);
  document.getElementById("pShips").textContent = pShipsData.filter(s => !s.sunk).length;
  document.getElementById("eShips").textContent = eShipsData.filter(s => !s.sunk).length;
}

function drawGrid(el, b, isPlayer) {
  el.innerHTML = "";
  for(let r=0; r<N; r++) {
    for(let c=0; c<N; c++) {
      const d = document.createElement("div");
      d.className = "cell";
      const v = b[r][c];
      if(v === 2) d.classList.add("miss");
      if(v === 3) d.classList.add("hit");
      if(!isPlayer) d.onclick = () => attackPlayer(r, c);
      el.appendChild(d);
    }
  }
}

function renderOverlay(overlayEl, shipsData, isPlayer) {
  overlayEl.innerHTML = "";
  const step = 10;
  
  shipsData.forEach(s => {
    if(!isPlayer && !s.sunk) return;

    const shipDiv = document.createElement("div");
    shipDiv.className = "rendered-ship";
    shipDiv.innerHTML = getShipSVG(s.id);

    const width = s.hor ? s.len * step : step;
    const height = s.hor ? step : s.len * step;
    
    shipDiv.style.width = `${width}%`;
    shipDiv.style.height = `${height}%`;
    shipDiv.style.left = `${s.c * step}%`;
    shipDiv.style.top = `${s.r * step}%`;
    
    if(!s.hor) {
      shipDiv.style.transformOrigin = "top left";
      shipDiv.style.transform = `rotate(90deg) translateY(-100%)`;
      shipDiv.style.width = `${s.len * step}%`;
      shipDiv.style.height = `${step}%`;
    }

    if(s.sunk) shipDiv.style.filter = "grayscale(100%) drop-shadow(0 0 8px #ff0055)";

    overlayEl.appendChild(shipDiv);
  });
}

function updateSunkState(b, shipsData) {
  shipsData.forEach(s => {
    let hits = 0;
    for(let k=0; k<s.len; k++) {
      let y = s.r + (s.hor ? 0 : k), x = s.c + (s.hor ? k : 0);
      if(b[y][x] === 3) hits++;
    }
    if(hits === s.len) s.sunk = true;
  });
}

function attackPlayer(r, c) {
  if(over || !turn || E[r][c] >= 2) return;
  E[r][c] = E[r][c] === 1 ? 3 : 2;
  updateSunkState(E, eShipsData);
  const posStr = `${cols[c]}${r+1}`;
  
  if(E[r][c] === 3) {
    statusEl.textContent = `💥 ALVO ATINGIDO em ${posStr}! Você ganhou outra jogada.`;
    render(); checkEnd(); return;
  }
  
  turn = false; render();
  statusEl.textContent = `🌊 Disparo em ${posStr} deu na água. A IA está calculando rota...`;
  setTimeout(aiTurn, 600);
  checkEnd();
}

function aiTurn() {
  if(over) return;
  let r, c;
  if(mode === "hard" && targetQueue.length) {
    [r,c] = targetQueue.shift();
    if(P[r][c] >= 2) { aiTurn(); return; }
  } else {
    do {
      r = Math.floor(Math.random()*N);
      c = Math.floor(Math.random()*N);
    } while(P[r][c] >= 2);
  }

  const posStr = `${cols[c]}${r+1}`;

  if(P[r][c] === 1) {
    P[r][c] = 3;
    if(mode === "hard") {
      for(const [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        let y = r+dy, x = c+dx;
        if(y>=0 && y<N && x>=0 && x<N && P[y][x] < 2) targetQueue.push([y,x]);
      }
    }
    updateSunkState(P, pShipsData);
    statusEl.textContent = `⚠️ ALERTA: A IA atingiu sua frota em ${posStr}! Ela joga novamente.`;
    render(); checkEnd();
    if(!over) setTimeout(aiTurn, 600);
  } else {
    P[r][c] = 2; turn = true; render();
    statusEl.textContent = `🛡️ A IA disparou em ${posStr} e errou. Sua vez!`;
    checkEnd();
  }
}

function checkEnd() {
  if(!P.flat().includes(1)) {
    over = true;
    statusEl.textContent = "☠️ DERROTA TÁTICA! A IA destruiu sua frota. Reinicie para revanche.";
    render();
  } else if(!E.flat().includes(1)) {
    over = true;
    statusEl.textContent = "🏆 VITÓRIA ABSOLUTA! DJ MARCELO DOMINOU OS MARES!";
    render();
  }
}

document.getElementById("newBtn").onclick = reset;
document.getElementById("easyBtn").onclick = () => {
  mode = "easy";
  document.getElementById("easyBtn").classList.add("active");
  document.getElementById("hardBtn").classList.remove("active");
  reset();
};
document.getElementById("hardBtn").onclick = () => {
  mode = "hard";
  document.getElementById("hardBtn").classList.add("active");
  document.getElementById("easyBtn").classList.remove("active");
  reset();
};

const musicToggleBtn = document.getElementById("musicToggleBtn");
musicToggleBtn.onclick = () => {
  const isPlaying = technoSynth.toggle();
  musicToggleBtn.textContent = isPlaying ? "🎵 Techno: ON" : "🎵 Techno: OFF";
  if (isPlaying) {
    musicToggleBtn.classList.add("active");
  } else {
    musicToggleBtn.classList.remove("active");
  }
};

document.getElementById("volumeSlider").oninput = (e) => {
  technoSynth.setVolume(parseFloat(e.target.value));
};

setupLabels();
reset();
</script>
